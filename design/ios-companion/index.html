<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Work in Cafe · iOS review</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body data-screen-id="001-map-shell">
    <main>
      <header>
        <p class="eyebrow">Native MVP · revision 001</p>
        <h1>Work in Cafe for iPhone</h1>
        <p>Right-click anywhere on the screen to leave a position-aware review note.</p>
      </header>
      <section class="phone" data-element-id="map.shell" aria-label="Map discovery mockup">
        <div class="map-grid"></div>
        <div class="brand glass" data-element-id="map.brand">☕ <strong>Work in Cafe</strong></div>
        <button class="search glass" data-element-id="map.search" aria-label="Search">⌕</button>
        <span class="pin cafe" data-element-id="map.pin.ten-belles">☕</span>
        <span class="pin library" data-element-id="map.pin.library">▤</span>
        <span class="cluster" data-element-id="map.cluster">12</span>
        <div class="detail glass" data-element-id="place.sheet">
          <span class="category">Café</span>
          <h2>Ten Belles</h2>
          <p>10 Rue de la Grange aux Belles</p>
          <button>Walking directions ↗</button>
        </div>
      </section>
      <aside id="notes" aria-live="polite"></aside>
    </main>
    <script src="app.js"></script>
  </body>
</html>
