version: 2

# Routine version-bump PRs so the next postcss-style transitive alert
# never has to be filed manually. Alerts (security) are a separate
# feature — already enabled in repo settings. See #92.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    # Group routine, low-risk bumps into one PR per week. Major bumps
    # still come through individually so we can review them.
    groups:
      patch-and-minor:
        update-types:
          - patch
          - minor
    commit-message:
      prefix: 'chore(deps)'
      include: scope
    labels:
      - dependencies
    # ESLint 10 is blocked upstream: eslint-config-next (incl. canary) bundles
    # eslint-plugin-react, whose every published release peers `eslint ^9.7`
    # only, so v10 crashes `npm run lint`. Ignore the major until upstream
    # ships ESLint 10 support; patch/minor on the ^9 line still flow. See #185.
    ignore:
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    commit-message:
      prefix: 'chore(actions)'
      include: scope
    labels:
      - dependencies
