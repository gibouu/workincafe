name: CodeQL

# Catches the class of bugs lint can't see — XSS, taint flows, prototype
# pollution, unsafe deserialization. Free on public repos. See #92.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Sunday 06:00 UTC — picks up new advisories that landed during the
    # week without us having pushed a commit.
    - cron: "0 6 * * 0"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          # GitHub Actions workflows themselves get a separate analyzer.
          - actions

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # security-extended adds a few high-signal queries beyond the
          # default set without much extra noise.
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
